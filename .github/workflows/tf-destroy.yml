name: Terraform Destroy (dispatch)

# 環境の完全撤収用。当面使わない環境を destroy してランニングコストをほぼ 0 にする。
# コードと tfstate バックエンドは残るため、tf-apply.yml の apply でいつでも再生できる。
#
# 誤爆防止：confirm に "destroy" と手入力しない限りジョブは実行されない。
# サプライチェーン対策：_terraform.yml と同じく action はフルコミット SHA で固定。
#
# 運用上の教訓（このワークフロー自身の障害履歴から）：
# - run #1: module.github_actions（CI自身のOIDC/ロール）をdestroy対象に含めて自己切断 → state rm で退避
# - run #4: state list に非対応の -lock=false を付与してエラー→ 2>/dev/null が握り潰して
#   「0行＝state空」誤判定→偽の成功。エラーは沈黙させず失敗させること
# - run #7: 部分destroy後の再planで aoss_collection_group_id が未確定化し for_each エラー
#   → vector_store=s3_vectors 上書きで module.opensearch を count=0 に落として回避

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "破棄する環境"
        type: choice
        options:
          - dev
          - stag
          - prod
        default: dev
      confirm:
        description: '確認のため destroy と入力'
        type: string
        required: true
      vector_store:
        description: "ベクトルストア上書き（部分destroy後の for_each 未確定エラー回避用。destroy対象は state 基準のため変わらない）"
        type: choice
        options:
          - keep
          - s3_vectors
          - opensearch
          - dual
        default: keep

# plan/apply と同じ group で直列化（destroy 中の apply 混入を防ぐ）
concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false # スクリプト内で $(terraform …) を使うため wrapper の標準出力装飾を無効化

      # destroy でも構成全体が評価されるため、apply と同様に layer 成果物が必要
      - name: Build Lambda layers
        run: |
          bash scripts/build-layer.sh authorizer
          bash scripts/build-layer.sh ingest-query

      - name: Restore tfvars from secret
        run: |
          cat > terraform/environments/${{ inputs.environment }}.tfvars << 'EOF'
          ${{ secrets.TFVARS }}
          EOF

      - name: Terraform Init
        run: terraform init -backend-config="environments/${{ inputs.environment }}-backend.hcl" -reconfigure
        working-directory: terraform

      - name: Pre-clean and destroy
        working-directory: terraform
        run: |
          set -uo pipefail

          # state の棚卸し。失敗したら沈黙せず落とす（「読めない」と「空」を混同しない）
          if ! STATE_LIST=$(terraform state list 2>&1); then
            echo "::error::terraform state list failed:"
            echo "$STATE_LIST"
            exit 1
          fi
          COUNT=$(echo "$STATE_LIST" | grep -c . || true)
          echo "resources in state: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "state is empty — nothing to destroy"
            exit 0
          fi

          # 前回失敗でロック解放に失敗している可能性があるため、対応コマンド（state rm / destroy）にのみ -lock=false。
          # このワークフローは concurrency group で直列化済み。※ state list は -lock 非対応なので付けないこと
          LOCKOPT="-lock=false"

          # ベクトルストアの上書き（for_each 未確定エラー回避用）
          EXTRA=""
          if [ "${{ inputs.vector_store }}" != "keep" ]; then
            EXTRA="-var=vector_store_type=${{ inputs.vector_store }}"
            echo "override: $EXTRA"
          fi

          # 【最重要】CI 自身の認証基盤を destroy 対象から外す（自己切断防止）
          for addr in $(echo "$STATE_LIST" | grep '^module\.github_actions\.' || true); do
            terraform state rm $LOCKOPT "$addr"
          done

          # documents 破壊ガード（prod のみ存在）：実インフラを持たない terraform_data のため state rm で安全
          for addr in $(echo "$STATE_LIST" | grep 'documents_destroy_guard' || true); do
            terraform state rm $LOCKOPT "$addr"
          done

          STATE_JSON=$(terraform show -json)

          # DynamoDB 削除保護（prod で true）を解除（既に削除済みのテーブルは失敗してよい）
          for t in $(echo "$STATE_JSON" | jq -r '[.. | objects | select(.type? == "aws_dynamodb_table") | .values.name] | unique[]'); do
            aws dynamodb update-table --table-name "$t" --no-deletion-protection-enabled > /dev/null 2>&1 \
              && echo "deletion protection off: $t" || true
          done

          # Cognito User Pool 削除保護（prod で ACTIVE）を解除
          for p in $(echo "$STATE_JSON" | jq -r '[.. | objects | select(.type? == "aws_cognito_user_pool") | .values.id] | unique[]'); do
            aws cognito-idp update-user-pool --user-pool-id "$p" --deletion-protection INACTIVE > /dev/null 2>&1 \
              && echo "deletion protection off: $p" || true
          done

          # CloudTrail を止める（ログ再流入で BucketNotEmpty が再発するのを防ぐ）
          for t in $(echo "$STATE_JSON" | jq -r '[.. | objects | select(.type? == "aws_cloudtrail") | .values.name] | unique[]'); do
            aws cloudtrail stop-logging --name "$t" 2>/dev/null && echo "stopped trail: $t" || true
          done

          # バージョニング付きバケットのパージ（全バージョン + 削除マーカー）
          purge_bucket() {
            local b="$1"
            aws s3api head-bucket --bucket "$b" 2>/dev/null || { echo "skip (not found): $b"; return 0; }
            echo "purge: $b"
            while :; do
              local out batch n
              out=$(aws s3api list-object-versions --bucket "$b" --max-keys 1000 --output json 2>/dev/null) || break
              batch=$(echo "$out" | jq '{Objects: ([(.Versions // [])[], (.DeleteMarkers // [])[]] | map({Key: .Key, VersionId: .VersionId})), Quiet: true}')
              n=$(echo "$batch" | jq '.Objects | length')
              [ "$n" -eq 0 ] && break
              echo "$batch" > /tmp/del.json
              aws s3api delete-objects --bucket "$b" --delete file:///tmp/del.json > /dev/null
              echo "  deleted $n versions"
            done
          }
          purge_all() {
            for b in $(terraform show -json | jq -r '[.. | objects | select(.type? == "aws_s3_bucket") | .values.bucket] | unique[]'); do
              purge_bucket "$b"
            done
          }
          purge_all

          # destroy 本体（失敗時：残バケットを再パージして 1 回だけリトライ。destroy は冪等）
          VF="environments/${{ inputs.environment }}.tfvars"
          if terraform destroy -auto-approve -no-color $LOCKOPT -var-file="$VF" $EXTRA; then
            exit 0
          fi
          echo "::warning::destroy failed once — re-purging buckets and retrying"
          purge_all
          terraform destroy -auto-approve -no-color $LOCKOPT -var-file="$VF" $EXTRA

      - name: Post check
        working-directory: terraform
        run: |
          set -uo pipefail
          if ! STATE_LIST=$(terraform state list 2>&1); then
            echo "::error::terraform state list failed (検証不能＝成功とは見なさない):"
            echo "$STATE_LIST"
            exit 1
          fi
          LEFT=$(echo "$STATE_LIST" | grep -c . || true)
          echo "remaining resources in state: $LEFT"
          echo "$STATE_LIST"
          [ "$LEFT" -eq 0 ] && echo "environment fully destroyed" || exit 1
