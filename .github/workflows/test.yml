name: Unit Tests

# Lambda ハンドラの単体テスト（pytest）。AWS は moto / monkeypatch でモックするため
# クレデンシャル不要・OIDC 権限も付与しない。重要な不変条件（user_id fail-closed・
# RRF・決定的 _id・covering ジョブの status フィルタ・認可）を回帰から守る。
# action は SHA 固定（_terraform.yml と同方針・更新は Dependabot）。

on:
  pull_request:
    paths:
      - "lambda/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pytest.ini"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "lambda/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # 本番ランタイムに合わせる

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
